name: osc-manual

# Dispatch-only wrapper carrying upstream's CI job steps, so a feature branch
# can be verified on a runner before any pull request exists. Upstream's ci.yml
# fires only on push/PR to main and develop, so a branch push triggers nothing.
#
# This file lives on the fork's default branch ONLY and must never be committed
# to a feature branch: GitHub reads workflow_dispatch from the default branch.

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Ref (branch, tag or SHA) to check out and test"
        required: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ inputs.target_ref }}"

      # Block scalar is load-bearing: a plain scalar containing ': ' makes the
      # file unparseable, and the run then reports zero jobs with a failure
      # conclusion, which reads as a test failure while having tested nothing.
      - name: Report checked-out SHA
        run: |
          echo "checked-out SHA: $(git rev-parse HEAD)"

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests
        run: uv run pytest tests/unit -v --tb=short

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ inputs.target_ref }}"

      - name: Report checked-out SHA
        run: |
          echo "checked-out SHA: $(git rev-parse HEAD)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: |
          uv run pytest --cov=openagent_eval \
            --cov-report=term-missing \
            --cov-fail-under=75
